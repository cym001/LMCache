[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lmcache-kv-transfer"
version = "0.1.0"
description = "GlobalKV metadata and KV transfer plugin for LMCache"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
dependencies = [
    "lmcache",
    "grpcio",
    "msgspec",
    "torch",
    "pyzmq>=25.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["lmcache_kv_transfer*"]
