syntax = "proto3";

package kvcache;

// 数据服务器信息
message DataServer {
    uint32 id = 1;         
    string ip = 2;                      // IP地址（字符串形式）
    uint32 http_port = 3;               // http端口
    uint32 init_port = 4;               // nixl init端口
    uint32 rpc_port = 5;                // rpc端口
    string model_name = 6;              // 模型名称
    string url = 7;                     // 实例url
}

// 元数据服务器信息
message MetaServer {
    uint32 id = 1;                      // 元数据管理器id
    string ip = 2;                      // IP地址（字符串形式）
    uint32 port = 3;                    // 端口
    uint32 layer = 4;                   // 网络层级
}

message KvBlockMeta {
    bytes token_hash = 1;               // 块哈希：固定长度 32 字节
    uint32 offset = 2;                  // token数量
    bytes pre_token = 3;                // 前驱块的哈希：固定长度 32 字节（根块为全零）
    repeated bytes next_tokens = 4;     // 后继块的 32 字节哈希列表
    repeated uint32 server_id = 5;      // 副本信息
}

// 本地单个 block 的引用计数
message LocalBlockCount {
    bytes token_hash = 1;           // 块哈希：固定长度 32 字节
    uint64 count = 2;               // 引用计数（定期同步时为增量计数，启动同步时为全量计数）
}

// 更新kvmeta的操作方式（创建、删除副本时）
message UpdateKvOp {
    bytes token_hash = 1;           // 块哈希：固定长度 32 字节
    uint32 operation = 2;           // server_id的修改方式（1为增加，2为删除）
    uint32 server_id = 3;           // server_id
}

// 分块的token信息
message Token_lists {
    repeated uint32 tokens = 1;    // token ids
}

// kvcache位置信息
message KvBlockPos {
    string model_name = 1;          // 模型名称
    string url  = 2;                // 推理实例的服务url
    uint32 len = 3;                 // 匹配的kvcache长度
}

message SearchResult{
    repeated KvBlockPos block_pos = 1;        // 单个请求的kv cache搜索结果
}

service KvMeta2Data {
    rpc UploadKvMeta(UploadKvMetaRequest) returns (UploadKvMetaResponse);
    rpc RegisterInstance(RegisterInstanceRequest) returns (RegisterInstanceResponse);
    rpc RemoveKvMeta(RemoveKvMetaRequest) returns (RemoveKvMetaResponse);
    rpc NewRequest(NewRequestRequest) returns (NewRequestResponse);
    rpc RequestEnd(RequestEndRequest) returns (RequestEndResponse);
}

// 1.数据服务器向元数据服务器上传本地新增kvcache元数据
message UploadKvMetaRequest {
    uint32 server_id = 1;
    repeated uint32 tokens = 2; 
}

message UploadKvMetaResponse {
    bool success = 1;
}

// 2.数据服务器向元数据服务器注册推理实例信息
message RegisterInstanceRequest {
    DataServer data_server = 1; 
}

message RegisterInstanceResponse {
    bool success = 1;
}

// 3.数据服务器向元数据服务器上传本地删除kvcache元数据
message RemoveKvMetaRequest {
    uint32 id = 1;    
    int32 remove_nums = 2;
    repeated bytes tokens_hash = 3;
}

message RemoveKvMetaResponse {
    bool success = 1;
}

// 4.数据服务器向元数据服务器上传本地新增请求
message NewRequestRequest {
    uint32 server_id = 1;
    string request_id = 2;
    repeated uint32 tokens = 3; 
}

message NewRequestResponse {
    bool success = 1;
}

// 5.数据服务器向元数据服务器上传本地请求结束
message RequestEndRequest {
    uint32 server_id = 1;
    string request_id = 2;
    repeated uint32 tokens = 3;  
}

message RequestEndResponse {
    bool success = 1;
}

service KvMeta2Meta {
    rpc GetKvMeta(GetKvMetaRequest) returns (GetKvMetaResponse);
    rpc UpdateKvMeta(UpdateKvMetaRequest) returns (UpdateKvMetaResponse);
    rpc SearchKvBlock(SearchKvBlockRequest) returns (SearchKvBlockResponse);
    rpc SearchKvBlockByPrompts(SearchKvBlockByPromptsRequest) returns (SearchKvBlockByPromptsResponse);
}

// 1. GetKvMeta - 获取副本列表
message GetKvMetaRequest {
    MetaServer meta_server = 1; // 本地节点的元数据服务器信息
    repeated DataServer data_server = 2; // 本地节点的数据服务器信息
}

message GetKvMetaResponse {
    repeated KvBlockMeta meta = 1;      // 副本信息列表
    repeated MetaServer meta_server = 2; // 目标节点已知的元数据服务器信息
    repeated DataServer data_server = 3; // 目标节点的数据服务器信息
    repeated LocalBlockCount local_counts = 4; // 本地所有 block 的全量计数
}

// 2. UpdateKvMeta - 更新kvcache元数据
message UpdateKvMetaRequest {
    repeated KvBlockMeta meta = 1;             // 本地新的kvcache元数据
    repeated LocalBlockCount local_counts = 2; // 本地所有 block 的增量计数
    repeated UpdateKvOp update_op= 3;          // 创建、删除KV Cache副本
    uint64 update_time = 4;                    // 本地快照的时间戳
}

message UpdateKvMetaResponse {
    repeated MetaServer meta_server = 1; // 目标节点已知的元数据服务器信息
    repeated DataServer data_server = 2; // 目标节点的数据服务器信息
}

// 3. SearchKvBlock - 根据token查找kvblock
message SearchKvBlockRequest {
    repeated Token_lists query_lists = 1;
}

message SearchKvBlockResponse {
    repeated SearchResult results = 1;
}

// 4. SearchKvBlockByPrompts - 根据prompts查找kvblock
message SearchKvBlockByPromptsRequest {
    repeated string model_name = 1;
    repeated string prompts = 2;
}

message SearchKvBlockByPromptsResponse {
    repeated SearchResult results = 1;
}