chunk_size: 256
local_cpu: True
max_local_cpu_size: 20
# enable_async_loading: True

pre_caching_hash_algorithm: "sha256_cbor"

# P2P configurations
p2p_host: "localhost"
p2p_init_ports: 8215
p2p_lookup_ports: 8216

enable_kv_transfer: True
kv_transfer_host: "127.0.0.1"
kv_transfer_http_port: 8013
kv_transfer_init_port: 8217
kv_transfer_rpc_port: 8218
kv_transfer_model_name: "Meta-Llama-3.1-8B-Instruct"
transfer_channel: "nixl"

# Controller configurations
# enable_controller: True
# lmcache_instance_id: "lmcache_instance_1"
# controller_pull_url: "localhost:8300"
# controller_reply_url: "localhost:8400"
# lmcache_worker_ports: 8500

enable_globalkv_server: true
globalkv_server_max_workers: 10

extra_config:
  lookup_backoff_time: 0.001