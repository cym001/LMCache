chunk_size: 256
local_cpu: True
max_local_cpu_size: 80
# enable_async_loading: True

enable_kv_events: true
pre_caching_hash_algorithm: "sha256_cbor"

# P2P configurations
p2p_host: "localhost"
p2p_init_ports: 8201
p2p_lookup_ports: 8202

enable_kv_transfer: True
kv_transfer_host: "127.0.0.1"
kv_transfer_http_port: 8010
kv_transfer_init_port: 8203
kv_transfer_rpc_port: 8204
kv_transfer_model_name: "DeepSeek-V2-Lite"
transfer_channel: "nixl"
storage_plugins: ["kv_transfer"]
kv_migration_plugins: ["globalkv"]

# Controller configurations
# enable_controller: True
# lmcache_instance_id: "lmcache_instance_1"
# controller_pull_url: "localhost:8300"
# controller_reply_url: "localhost:8400"
# lmcache_worker_ports: 8500

enable_globalkv_server: true
globalkv_server_max_workers: 2

# Internal API server configurations
internal_api_server_enabled: True
internal_api_server_port_start: 6999  # worker 0 -> port 7000
internal_api_server_include_index_list: [1]

extra_config:
  lookup_backoff_time: 0.001
  storage_plugin.kv_transfer.module_path: lmcache_kv_transfer.backend
  storage_plugin.kv_transfer.class_name: KvTransferBackend
  kv_migration_plugin.globalkv.module_path: lmcache_kv_transfer.migration
  kv_migration_plugin.globalkv.class_name: GlobalKvMigrationPlugin
  kv_migration_plugin.globalkv.meta_host: 127.0.0.1
  kv_migration_plugin.globalkv.meta_port: 17070
  kv_migration_plugin.globalkv.enable_rpc_server: true